# CONEXIÓN A MYSQL
spring.application.name=MS-RESERVAS
server.port=8083
spring.datasource.url=jdbc:mysql://localhost:3306/prueba2?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.profiles.active=dev

# CONFIGURACIÓN DE JPA/HIBÉRNATE PARA MYSQL
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# HIKARI
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

# FLYWAY
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

spring.cloud.compatibility-verifier.enabled=false

# SWAGGER / OPENAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# RUTA SWAGGER
springdoc.swagger-ui.path=/swagger-ui.html

#EUREKA
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# DESACTIVAR JMX
spring.jmx.enabled=false