# ================================
# CONFIGURACIÓN TESTS

# CONEXIÓN A MYSQL
spring.datasource.url=jdbc:mysql://localhost:3306/prueba1_test?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# CONFIGURACIÓN JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# FLYWAY DESACTIVADO EN TESTS
spring.flyway.enabled=false

# DESACTIVAR EUREKA Y DISCOVERY DURANTE TESTS
eureka.client.enabled=false
spring.cloud.discovery.enabled=false